name: Azim Books

on:
  schedule:
    # Iran time (UTC+3:30): 08:00, 10:00, 13:00, 17:00, 21:00
    - cron: "30 4,6,9,13,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azim-books
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          fc-cache -f
          pip install -r azim_requirements.txt

      - name: Make and send video
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python azim_books_bot.py

      - name: Save list of posted books
        run: |
          git config user.name "azim-bot"
          git config user.email "azim-bot@users.noreply.github.com"
          git add azim_posted.json
          git commit -m "posted book" || exit 0
          git pull --rebase
          git push
