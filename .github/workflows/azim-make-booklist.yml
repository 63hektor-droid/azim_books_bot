name: azim-make-booklist

# You do NOT need to run this: the video workflow builds the list by itself on its first run.
# Run it by hand (Actions -> azim-make-booklist -> Run workflow) only to rebuild the list from scratch:
# delete azim_books_list.json first, or the new list simply replaces it.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azim-book-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install requests

      - name: Build the list of novels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python azim_make_booklist.py

      - name: Save the list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add azim_books_list.json
          git diff --cached --quiet || git commit -m "azim: list of novels"
          git pull --rebase origin main || true
          git push
