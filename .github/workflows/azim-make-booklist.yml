name: azim-make-booklist

# Run this ONCE by hand (Actions -> azim-make-booklist -> Run workflow).
# It builds azim_books_list.json (the 2000 most famous novels) and commits it.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azim-book-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install requests

      - name: Build the list of novels
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python azim_make_booklist.py

      - name: Save the list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add azim_books_list.json
          git diff --cached --quiet || git commit -m "azim: list of 2000 novels"
          git pull --rebase origin main || true
          git push
