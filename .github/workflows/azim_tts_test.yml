name: azim-tts-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install "sokhanvar[pocket] @ git+https://github.com/tavallaie/sokhanvar.git" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip list 2>/dev/null | grep -i -E "pocket|sokhanvar|torch|transformers" || true
      - name: Run the voice test
        run: python azim_tts_test.py 2>&1 | grep -v "Maximum generation length" || true
      - name: Save the test audio files
        uses: actions/upload-artifact@v4
        with:
          name: azim-tts-test-audio
          path: azim_test_out/result_*.wav
          if-no-files-found: warn
